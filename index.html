<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfSnap">
<meta name="theme-color" content="#e8f4ff">
<title>ShelfSnap</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-primary: #1a7fff;
    --blue-dark: #005acc;
    --blue-light: #e8f4ff;
    --blue-mid: #c5deff;
    --cyan: #00c8ff;
    --white: #ffffff;
    --gray-100: #f4f8ff;
    --gray-200: #e0eaf8;
    --gray-400: #8aabcc;
    --gray-600: #4a6a8a;
    --gray-800: #1a2d40;
    --danger: #ff4d6d;
    --success: #00c896;
    --shadow-sm: 0 2px 8px rgba(26,127,255,0.10);
    --shadow-md: 0 4px 20px rgba(26,127,255,0.15);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-full: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', 'DM Sans', sans-serif;
    background: var(--blue-light);
    color: var(--gray-800);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* HEADER */
  .app-header {
    background: var(--white);
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
    position: sticky; top: 0; z-index: 100;
  }
  .app-logo { display: flex; align-items: center; gap: 10px; }
  .app-logo svg { width: 36px; height: 36px; border-radius: 9px; }
  .app-logo-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700; font-size: 20px;
    color: var(--blue-primary); letter-spacing: -0.5px;
  }
  .header-btn {
    background: var(--blue-light); border: none; border-radius: var(--radius-sm);
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--blue-primary); transition: background 0.2s;
  }
  .header-btn:active { background: var(--blue-mid); }

  /* SCROLL */
  .scroll-content { flex: 1; overflow-y: auto; padding: 20px 16px 180px; }

  /* SECTION TITLE */
  .section-title {
    font-size: 12px; font-weight: 700; color: var(--gray-400);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 12px; margin-top: 24px;
  }
  .section-title:first-child { margin-top: 0; }

  /* FOLDER GRID */
  .folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .folder-card {
    background: var(--white); border-radius: var(--radius);
    padding: 18px 14px 16px; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 2px solid transparent; position: relative; overflow: hidden;
  }
  .folder-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue-primary), var(--cyan));
    opacity: 0; transition: opacity 0.2s;
  }
  .folder-card:active { transform: scale(0.97); }
  .folder-card.selected { border-color: var(--blue-primary); box-shadow: var(--shadow-md); }
  .folder-card.selected::before { opacity: 1; }
  .folder-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
  }
  .folder-icon svg { width: 24px; height: 24px; color: var(--blue-primary); }
  .folder-name { font-size: 14px; font-weight: 700; color: var(--gray-800); line-height: 1.3; word-break: break-all; }
  .folder-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
  .folder-card.add-card {
    border: 2px dashed var(--blue-mid); box-shadow: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px;
  }
  .folder-card.add-card .folder-name { color: var(--gray-400); font-weight: 500; font-size: 13px; text-align: center; }
  .selected-badge {
    position: absolute; top: 10px; right: 10px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--blue-primary);
    display: flex; align-items: center; justify-content: center;
  }
  .selected-badge svg { width: 12px; height: 12px; color: white; }

  /* SHOOT BAR */
  .shoot-bar {
    position: fixed; bottom: 60px; left: 0; right: 0;
    background: var(--white); padding: 8px 20px 10px;
    box-shadow: 0 -2px 12px rgba(26,127,255,0.10);
    display: flex; flex-direction: column; gap: 6px;
  }
  .selected-info {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; background: var(--blue-light); border-radius: var(--radius-sm);
  }
  .selected-info-text { font-size: 12px; font-weight: 600; color: var(--blue-dark); flex: 1; }
  .selected-info-text span { color: var(--gray-400); font-weight: 400; }
  .btn-shoot {
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    color: white; border: none; border-radius: var(--radius);
    padding: 16px; font-size: 16px; font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif; width: 100%;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(26,127,255,0.35);
    transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.02em;
  }
  .btn-shoot:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(26,127,255,0.2); }
  .btn-shoot:disabled { background: var(--gray-200); color: var(--gray-400); box-shadow: none; cursor: default; }

  /* CAMERA SCREEN */
  #screen-camera { background: #000; position: relative; }
  .camera-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  }
  .camera-folder-badge {
    flex: 1; background: rgba(26,127,255,0.85); backdrop-filter: blur(10px);
    border-radius: var(--radius-full); padding: 8px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .camera-folder-badge svg { width: 16px; height: 16px; color: white; flex-shrink: 0; }
  .camera-folder-name { color: white; font-size: 14px; font-weight: 700; }
  .btn-close-camera {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: white;
  }
  #video-preview { width: 100%; height: 100vh; height: 100dvh; object-fit: cover; }
  .camera-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px 32px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  }
  .shutter-btn {
    width: 76px; height: 76px; border-radius: 50%;
    background: white; border: 4px solid rgba(255,255,255,0.4);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.1s; margin: 0 auto;
  }
  .shutter-btn:active { transform: scale(0.92); }
  .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: white; border: 2px solid rgba(0,0,0,0.1); }
  .shot-count-badge {
    background: rgba(0,200,150,0.9); color: white; border-radius: var(--radius-full);
    padding: 8px 16px; font-size: 13px; font-weight: 700; min-width: 60px; text-align: center;
  }
  .camera-side-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: white;
  }

  /* FLASH */
  .shutter-flash {
    position: fixed; inset: 0; background: white;
    opacity: 0; pointer-events: none; z-index: 999; transition: opacity 0.05s;
  }
  .shutter-flash.flash { opacity: 0.8; }

  /* FOLDER MANAGE */
  .folder-manage-list { display: flex; flex-direction: column; gap: 10px; }
  .folder-manage-item {
    background: var(--white); border-radius: var(--radius-sm);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .folder-manage-name { flex: 1; font-size: 15px; font-weight: 600; }
  .btn-delete-folder {
    width: 32px; height: 32px; border-radius: 8px;
    background: #fff0f3; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--danger);
  }

  /* SETTINGS */
  .settings-section { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
  .settings-row {
    padding: 16px 18px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--gray-100); cursor: pointer; transition: background 0.15s;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--gray-100); }
  .settings-row-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .settings-row-icon.blue { background: var(--blue-light); color: var(--blue-primary); }
  .settings-row-icon.red { background: #fff0f3; color: var(--danger); }
  .settings-row-body { flex: 1; }
  .settings-row-title { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .settings-row-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .settings-chevron { color: var(--gray-400); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(13,58,110,0.4); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--white); border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px; animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: var(--gray-800); }
  .modal-input {
    width: 100%; border: 2px solid var(--blue-mid); border-radius: var(--radius-sm);
    padding: 14px 16px; font-size: 16px; font-family: 'Noto Sans JP', sans-serif;
    color: var(--gray-800); outline: none; transition: border-color 0.2s; margin-bottom: 14px;
  }
  .modal-input:focus { border-color: var(--blue-primary); }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 14px; background: var(--gray-100); border: none;
    border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
    color: var(--gray-600); cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-confirm {
    flex: 2; padding: 14px;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; color: white;
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 3px 12px rgba(26,127,255,0.3);
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: var(--gray-800); color: white; border-radius: var(--radius-full);
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    white-space: nowrap; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* INFO BANNER */
  .info-banner {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 14px 16px; background: #e8f4ff;
    border-radius: var(--radius-sm); margin-bottom: 16px;
    border-left: 3px solid var(--blue-primary);
  }
  .info-banner svg { width: 18px; height: 18px; color: var(--blue-primary); flex-shrink: 0; margin-top: 1px; }
  .info-banner-text { font-size: 12px; color: var(--gray-600); line-height: 1.6; }
  .info-banner-text strong { color: var(--blue-dark); }

  /* SAVE COUNT */
  .save-count-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--white); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow-sm);
  }
  .save-count-label { font-size: 12px; color: var(--gray-400); font-weight: 600; }
  .save-count-num { font-size: 22px; font-weight: 700; color: var(--blue-primary); font-family: 'DM Sans', sans-serif; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); padding: 8px 0;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around;
    box-shadow: 0 -2px 12px rgba(26,127,255,0.08); z-index: 50;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 6px 20px; border-radius: var(--radius-sm);
    transition: background 0.15s; border: none; background: none;
  }
  .nav-item:active { background: var(--blue-light); }
  .nav-item svg { width: 24px; height: 24px; color: var(--gray-400); transition: color 0.15s; }
  .nav-item span { font-size: 10px; color: var(--gray-400); font-weight: 600; transition: color 0.15s; }
  .nav-item.active svg { color: var(--blue-primary); }
  .nav-item.active span { color: var(--blue-primary); }
</style>
</head>
<body>

<!-- ===== SCREEN: HOME ===== -->
<div id="screen-home" class="screen active">
  <div class="app-header">
    <div class="app-logo">
      <svg width="36" height="36" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgI" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#c5deff"/></linearGradient>
          <linearGradient id="phI" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a8fff"/><stop offset="100%" stop-color="#1460cc"/></linearGradient>
          <linearGradient id="flI" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a7fff"/><stop offset="100%" stop-color="#005acc"/></linearGradient>
        </defs>
        <rect width="120" height="120" fill="url(#bgI)"/>
        <circle cx="60" cy="60" r="52" fill="white" opacity="0.3"/>
        <rect x="38" y="18" width="44" height="34" rx="5" fill="url(#phI)"/>
        <rect x="38" y="18" width="44" height="34" rx="5" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
        <circle cx="49" cy="28" r="4" fill="#ffe566" opacity="0.9"/>
        <polygon points="38,52 52,37 62,46 70,39 82,52" fill="#0040aa" opacity="0.5"/>
        <path d="M60 54 L60 63 L35 63 L35 72" stroke="#1a7fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 63 L85 63 L85 72" stroke="#1a7fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="31,72 35,67 39,72" fill="#1a7fff"/>
        <polygon points="81,72 85,67 89,72" fill="#1a7fff"/>
        <path d="M24 75 L24 73 Q24 72 25 72 L34 72 L36 74 L45 74 Q46 74 46 75 L46 90 Q46 91 45 91 L25 91 Q24 91 24 90 Z" fill="url(#flI)"/>
        <rect x="24" y="76" width="22" height="15" rx="1" fill="white" opacity="0.15"/>
        <path d="M74 75 L74 73 Q74 72 75 72 L84 72 L86 74 L95 74 Q96 74 96 75 L96 90 Q96 91 95 91 L75 91 Q74 91 74 90 Z" fill="url(#flI)"/>
        <rect x="74" y="76" width="22" height="15" rx="1" fill="white" opacity="0.15"/>
      </svg>
      <span class="app-logo-text">ShelfSnap</span>
    </div>
  </div>

  <div class="scroll-content">
    <div class="info-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div class="info-banner-text">
        撮影した写真は<strong>カメラロールに自動保存</strong>されます。<br>
        ファイル名に店舗名・日時が入るので、OneDriveの自動同期後も検索で整理できます。
      </div>
    </div>

    <div id="save-count-row" class="save-count-row" style="display:none">
      <span class="save-count-label">今日の撮影枚数</span>
      <span class="save-count-num" id="today-count">0枚</span>
    </div>

    <div class="section-title">保存先フォルダを選択</div>
    <div class="folder-grid" id="folder-grid"></div>
  </div>

  <div class="shoot-bar">
    <div class="selected-info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4l2-3h4l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span class="selected-info-text" id="selected-folder-text"><span>フォルダを選択してください</span></span>
    </div>
    <button class="btn-shoot" id="btn-open-camera" disabled onclick="openCamera()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      撮影する
    </button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="showScreen('home','home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>ホーム</span>
    </button>
    <button class="nav-item" onclick="showScreen('folders','folders')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>フォルダ</span>
    </button>
    <button class="nav-item" onclick="showScreen('settings','settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>設定</span>
    </button>
  </div>
</div>

<!-- ===== SCREEN: CAMERA ===== -->
<div id="screen-camera" class="screen">
  <div class="camera-header">
    <div class="camera-folder-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="camera-folder-name" id="camera-folder-name">—</span>
    </div>
    <button class="btn-close-camera" onclick="closeCamera()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <video id="video-preview" autoplay playsinline muted></video>

  <div class="camera-controls">
    <div class="shot-count-badge" id="shot-count">0枚</div>
    <button class="shutter-btn" onclick="takePhoto()">
      <div class="shutter-inner"></div>
    </button>
    <button class="camera-side-btn" onclick="switchCamera()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>

</div>

<div id="screen-folders" class="screen">
  <div class="app-header">

    <button style="width:100%;padding:14px;background:var(--blue-light);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--blue-primary);cursor:pointer;font-family:'Noto Sans JP',sans-serif;" onclick="openAddFolderModal()">
      ＋ フォルダを追加

  </div>

    <div class="section-title">撮影データ</div>

  </div>
  <div class="bottom-nav">
    <button class="nav-item" onclick="showScreen('home','home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>ホーム</span>
    </button>
    <button class="nav-item" onclick="showScreen('folders','folders')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>フォルダ</span>
    </button>
    <button class="nav-item active" onclick="showScreen('settings','settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>設定</span>
    </button>
  </div>
</div>

<!-- ADD FOLDER MODAL -->
<div class="modal-overlay" id="add-folder-modal" onclick="closeModalOutside(event)">
  <div class="modal-sheet">
    <div class="modal-title">新しいフォルダを追加</div>
    <input class="modal-input" id="new-folder-input" type="text" placeholder="例：A店、競合店、棚割確認" maxlength="40">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddFolderModal()">キャンセル</button>
      <button class="btn-confirm" onclick="addFolder()">追加する</button>
    </div>
  </div>
</div>

<!-- SHUTTER FLASH / TOAST -->
<div class="shutter-flash" id="shutter-flash"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
const STATE = {
  folders: JSON.parse(localStorage.getItem('ss_folders') || '["A店","B店","今週の一枚","競合店"]'),
  selectedFolder: null,
  shotCount: 0,
  totalCount: parseInt(localStorage.getItem('ss_total') || '0'),
  todayCount: 0,
  stream: null,
  facingMode: 'environment',
};

// ============================================================
// INIT
// ============================================================
function init() {
  renderFolderGrid();
  renderFolderManageList();
  updateTodayCount();
  document.getElementById('settings-total-count').textContent = STATE.totalCount + '枚';
}

// ============================================================
// SCREEN NAV
// ============================================================
function showScreen(name, navId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('#screen-' + name + ' .nav-item').forEach(n => n.classList.remove('active'));
  if (navId) {
    const navBtns = document.querySelectorAll('#screen-' + name + ' .nav-item');
    const map = { home: 0, folders: 1, settings: 2 };
    if (navBtns[map[navId]]) navBtns[map[navId]].classList.add('active');
  }
}

// ============================================================
// FOLDER RENDER
// ============================================================
function renderFolderGrid() {
  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';
  STATE.folders.forEach(name => {
    const card = document.createElement('div');
    card.className = 'folder-card' + (STATE.selectedFolder === name ? ' selected' : '');
    card.innerHTML = `
      ${STATE.selectedFolder === name ? '<div class="selected-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>' : ''}
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
      <div class="folder-name">${escHtml(name)}</div>
      <div class="folder-hint">タップして選択</div>
    `;
    card.addEventListener('click', () => selectFolder(name));
    grid.appendChild(card);
  });
  // 追加カード
  const addCard = document.createElement('div');
  addCard.className = 'folder-card add-card';
  addCard.innerHTML = `
    <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
    <div class="folder-name">フォルダを追加</div>
  `;
  addCard.addEventListener('click', openAddFolderModal);
  grid.appendChild(addCard);
}

function renderFolderManageList() {
  const list = document.getElementById('folder-manage-list');
  list.innerHTML = '';
  STATE.folders.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'folder-manage-item';
    item.innerHTML = `
      <div style="width:36px;height:36px;border-radius:10px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span class="folder-manage-name">${escHtml(name)}</span>
      <button class="btn-delete-folder" onclick="deleteFolder(${i})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    `;
    list.appendChild(item);
  });
}

function selectFolder(name) {
  STATE.selectedFolder = name;
  renderFolderGrid();
  document.getElementById('btn-open-camera').disabled = false;
  document.getElementById('selected-folder-text').innerHTML = `保存先：<strong>${escHtml(name)}</strong>`;
}

// ============================================================
// FOLDER CRUD
// ============================================================
function openAddFolderModal() {
  document.getElementById('new-folder-input').value = '';
  document.getElementById('add-folder-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-folder-input').focus(), 300);
}
function closeAddFolderModal() {
  document.getElementById('add-folder-modal').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
}
function addFolder() {
  const val = document.getElementById('new-folder-input').value.trim();
  if (!val) return;
  if (STATE.folders.includes(val)) { showToast('同じ名前のフォルダが既にあります'); return; }
  STATE.folders.push(val);
  saveFolders();
  renderFolderGrid();
  renderFolderManageList();
  closeAddFolderModal();
  showToast(`「${val}」を追加しました`);
}
function deleteFolder(i) {
  const name = STATE.folders[i];
  if (!confirm(`「${name}」を削除しますか？`)) return;
  STATE.folders.splice(i, 1);
  if (STATE.selectedFolder === name) {
    STATE.selectedFolder = null;
    document.getElementById('btn-open-camera').disabled = true;
    document.getElementById('selected-folder-text').innerHTML = '<span>フォルダを選択してください</span>';
  }
  saveFolders();
  renderFolderGrid();
  renderFolderManageList();
  showToast(`「${name}」を削除しました`);
}
function saveFolders() {
  localStorage.setItem('ss_folders', JSON.stringify(STATE.folders));
}
function openRootFolderModal() {
  showToast('ファイル名形式：フォルダ名_YYYYMMDD_HHMMSS.jpg');
}
function resetCount() {
  if (!confirm('撮影カウントをリセットしますか？')) return;
  STATE.totalCount = 0;
  localStorage.setItem('ss_total', '0');
  document.getElementById('settings-total-count').textContent = '0枚';
  showToast('リセットしました');
}

// ============================================================
// CAMERA
// ============================================================
async function openCamera() {
  if (!STATE.selectedFolder) return;
  document.getElementById('camera-folder-name').textContent = STATE.selectedFolder;
  STATE.shotCount = 0;
  updateShotCount();
  showScreen('camera', null);

  try {
    const constraints = {
      video: { facingMode: STATE.facingMode, width: { ideal: 3840 }, height: { ideal: 2160 } }
    };
    STATE.stream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('video-preview').srcObject = STATE.stream;
  } catch(e) {
    showToast('カメラへのアクセスを許可してください');
    showScreen('home', 'home');
  }
}

function closeCamera() {
  if (STATE.stream) { STATE.stream.getTracks().forEach(t => t.stop()); STATE.stream = null; }
  showScreen('home', 'home');
}

async function switchCamera() {
  STATE.facingMode = STATE.facingMode === 'environment' ? 'user' : 'environment';
  if (STATE.stream) STATE.stream.getTracks().forEach(t => t.stop());
  try {
    STATE.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: STATE.facingMode, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
    document.getElementById('video-preview').srcObject = STATE.stream;
  } catch(e) { showToast('カメラの切り替えに失敗しました'); }
}

function takePhoto() {
  const video = document.getElementById('video-preview');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  // フラッシュ演出
  const flash = document.getElementById('shutter-flash');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 150);

  STATE.shotCount++;
  STATE.totalCount++;
  STATE.todayCount++;
  updateShotCount();
  updateTodayCount();
  localStorage.setItem('ss_total', STATE.totalCount);
  document.getElementById('settings-total-count').textContent = STATE.totalCount + '枚';

  const now = new Date();
  const fname = `${STATE.selectedFolder}_${formatDate(now)}.jpg`;

  canvas.toBlob(blob => {
    const file = new File([blob], fname, { type: 'image/jpeg' });

    // ① 写真アプリに保存（シェアシート）
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .catch(() => {});
    }

    // ② ダウンロードフォルダにも保存（ファイル名保持）
    setTimeout(() => {
      fallbackDownload(blob, fname);
      showToast(`📷 保存：${STATE.selectedFolder}`);
    }, 500);

  }, 'image/jpeg', 0.92);
}

function fallbackDownload(blob, fname) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
  showToast(`📷 ${fname}`);
}

function updateShotCount() {
  document.getElementById('shot-count').textContent = `${STATE.shotCount}枚`;
}

function updateTodayCount() {
  if (STATE.todayCount > 0) {
    document.getElementById('save-count-row').style.display = 'flex';
    document.getElementById('today-count').textContent = STATE.todayCount + '枚';
  }
}

function formatDate(d) {
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

// ============================================================
// UTILS
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// SERVICE WORKER
// ============================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
