<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfSnap">
<meta name="theme-color" content="#e8f4ff">
<title>ShelfSnap</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-primary: #1a7fff;
    --blue-dark: #005acc;
    --blue-light: #e8f4ff;
    --blue-mid: #c5deff;
    --blue-deep: #0d3a6e;
    --cyan: #00c8ff;
    --white: #ffffff;
    --gray-100: #f4f8ff;
    --gray-200: #e0eaf8;
    --gray-400: #8aabcc;
    --gray-600: #4a6a8a;
    --gray-800: #1a2d40;
    --danger: #ff4d6d;
    --success: #00c896;
    --shadow-sm: 0 2px 8px rgba(26,127,255,0.10);
    --shadow-md: 0 4px 20px rgba(26,127,255,0.15);
    --shadow-lg: 0 8px 32px rgba(26,127,255,0.20);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-full: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', 'DM Sans', sans-serif;
    background: var(--blue-light);
    color: var(--gray-800);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ========== SCREENS ========== */
  .screen { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ========== HEADER ========== */
  .app-header {
    background: var(--white);
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    position: sticky; top: 0; z-index: 100;
  }
  .app-logo {
    display: flex; align-items: center; gap: 10px;
  }
  .app-logo svg { width: 36px; height: 36px; border-radius: 9px; }
  .app-logo-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700; font-size: 20px;
    color: var(--blue-primary);
    letter-spacing: -0.5px;
  }
  .header-btn {
    background: var(--blue-light);
    border: none; border-radius: var(--radius-sm);
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--blue-primary);
    transition: background 0.2s;
  }
  .header-btn:active { background: var(--blue-mid); }

  /* ========== SCROLL CONTENT ========== */
  .scroll-content {
    flex: 1; overflow-y: auto; padding: 20px 16px 100px;
  }

  /* ========== SECTION TITLE ========== */
  .section-title {
    font-size: 12px; font-weight: 700;
    color: var(--gray-400);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 12px; margin-top: 24px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ========== FOLDER GRID ========== */
  .folder-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .folder-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px 14px 16px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .folder-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue-primary), var(--cyan));
    opacity: 0; transition: opacity 0.2s;
  }
  .folder-card:active { transform: scale(0.97); }
  .folder-card.selected {
    border-color: var(--blue-primary);
    box-shadow: var(--shadow-md);
  }
  .folder-card.selected::before { opacity: 1; }
  .folder-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .folder-icon svg { width: 24px; height: 24px; color: var(--blue-primary); }
  .folder-name {
    font-size: 14px; font-weight: 700;
    color: var(--gray-800);
    line-height: 1.3;
    word-break: break-all;
  }
  .folder-count {
    font-size: 11px; color: var(--gray-400);
    margin-top: 4px;
  }
  .folder-card.add-card {
    border: 2px dashed var(--blue-mid);
    box-shadow: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 110px;
  }
  .folder-card.add-card .folder-icon {
    background: var(--blue-light);
  }
  .folder-card.add-card .folder-name {
    color: var(--gray-400); font-weight: 500; font-size: 13px;
    text-align: center;
  }

  /* ========== SELECTED BADGE ========== */
  .selected-badge {
    position: absolute; top: 10px; right: 10px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--blue-primary);
    display: flex; align-items: center; justify-content: center;
  }
  .selected-badge svg { width: 12px; height: 12px; color: white; }

  /* ========== SHOOT BUTTON AREA ========== */
  .shoot-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white);
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(26,127,255,0.10);
    display: flex; flex-direction: column; gap: 10px;
  }
  .selected-info {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--blue-light);
    border-radius: var(--radius-sm);
  }
  .selected-info-text {
    font-size: 13px; font-weight: 600; color: var(--blue-dark);
    flex: 1;
  }
  .selected-info-text span { color: var(--gray-400); font-weight: 400; }
  .btn-shoot {
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    color: white; border: none;
    border-radius: var(--radius);
    padding: 16px;
    font-size: 16px; font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(26,127,255,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-shoot:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(26,127,255,0.2); }
  .btn-shoot:disabled {
    background: var(--gray-200); color: var(--gray-400);
    box-shadow: none; cursor: default;
  }
  .btn-shoot svg { width: 20px; height: 20px; }

  /* ========== CAMERA SCREEN ========== */
  #screen-camera {
    background: #000;
    position: relative;
  }
  .camera-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  }
  .camera-folder-badge {
    flex: 1;
    background: rgba(26,127,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-full);
    padding: 8px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .camera-folder-badge svg { width: 16px; height: 16px; color: white; flex-shrink: 0; }
  .camera-folder-name { color: white; font-size: 14px; font-weight: 700; }
  .btn-close-camera {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white;
  }
  #video-preview {
    width: 100%; height: 100vh; height: 100dvh;
    object-fit: cover;
  }
  .camera-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px 32px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  }
  .shutter-btn {
    width: 76px; height: 76px; border-radius: 50%;
    background: white;
    border: 4px solid rgba(255,255,255,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s;
    margin: 0 auto;
  }
  .shutter-btn:active { transform: scale(0.92); }
  .shutter-inner {
    width: 58px; height: 58px; border-radius: 50%;
    background: white;
    border: 2px solid rgba(0,0,0,0.1);
  }
  .shot-count-badge {
    background: rgba(0,200,150,0.9);
    color: white; border-radius: var(--radius-full);
    padding: 8px 16px; font-size: 13px; font-weight: 700;
    min-width: 60px; text-align: center;
  }
  .camera-side-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white;
  }

  /* ========== FLASH EFFECT ========== */
  .shutter-flash {
    position: fixed; inset: 0; background: white;
    opacity: 0; pointer-events: none; z-index: 999;
    transition: opacity 0.05s;
  }
  .shutter-flash.flash { opacity: 0.8; }

  /* ========== SETTINGS SCREEN ========== */
  #screen-settings .scroll-content { padding-bottom: 40px; }
  .settings-section {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .settings-row {
    padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--gray-100);
    cursor: pointer;
    transition: background 0.15s;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--gray-100); }
  .settings-row-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .settings-row-icon.blue { background: var(--blue-light); color: var(--blue-primary); }
  .settings-row-icon.green { background: #e6fff8; color: var(--success); }
  .settings-row-icon.red { background: #fff0f3; color: var(--danger); }
  .settings-row-body { flex: 1; }
  .settings-row-title { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .settings-row-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .settings-chevron { color: var(--gray-400); }

  /* ========== FOLDER MANAGE SCREEN ========== */
  .folder-manage-list { display: flex; flex-direction: column; gap: 10px; }
  .folder-manage-item {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .folder-manage-name { flex: 1; font-size: 15px; font-weight: 600; }
  .btn-delete-folder {
    width: 32px; height: 32px; border-radius: 8px;
    background: #fff0f3; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--danger);
  }

  /* ========== ADD FOLDER MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(13,58,110,0.4);
    backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--white);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-title {
    font-size: 17px; font-weight: 700;
    margin-bottom: 16px; color: var(--gray-800);
  }
  .modal-input {
    width: 100%; border: 2px solid var(--blue-mid);
    border-radius: var(--radius-sm);
    padding: 14px 16px; font-size: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--gray-800); outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .modal-input:focus { border-color: var(--blue-primary); }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1; padding: 14px;
    background: var(--gray-100); border: none;
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    color: var(--gray-600); cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-confirm {
    flex: 2; padding: 14px;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; color: white;
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 3px 12px rgba(26,127,255,0.3);
  }

  /* ========== TOAST ========== */
  .toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: var(--gray-800);
    color: white; border-radius: var(--radius-full);
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    white-space: nowrap; z-index: 300;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ========== ONEDRIVE STATUS ========== */
  .od-status-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    font-size: 13px; font-weight: 600;
  }
  .od-status-banner.connected {
    background: #e6fff8; color: #00a87a;
  }
  .od-status-banner.disconnected {
    background: #fff0f3; color: var(--danger);
  }
  .od-status-banner svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ========== UPLOAD QUEUE ========== */
  .upload-queue {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow-sm);
  }
  .upload-queue-title {
    font-size: 12px; font-weight: 700; color: var(--gray-400);
    letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .upload-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 12px; color: var(--gray-600);
  }
  .upload-item:last-child { border-bottom: none; }
  .upload-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .upload-status.pending { background: var(--gray-400); }
  .upload-status.uploading { background: var(--blue-primary); animation: pulse 1s infinite; }
  .upload-status.done { background: var(--success); }
  .upload-status.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ========== BOTTOM NAV ========== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white);
    padding: 8px 0;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around;
    box-shadow: 0 -2px 12px rgba(26,127,255,0.08);
    z-index: 50;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 6px 20px; border-radius: var(--radius-sm);
    transition: background 0.15s; border: none; background: none;
  }
  .nav-item:active { background: var(--blue-light); }
  .nav-item svg { width: 24px; height: 24px; color: var(--gray-400); transition: color 0.15s; }
  .nav-item span { font-size: 10px; color: var(--gray-400); font-weight: 600; transition: color 0.15s; }
  .nav-item.active svg { color: var(--blue-primary); }
  .nav-item.active span { color: var(--blue-primary); }

  /* ========== ONEDRIVE CONNECT ========== */
  .od-connect-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    box-shadow: var(--shadow-md);
    margin: 20px 0;
  }
  .od-connect-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .od-connect-icon svg { width: 36px; height: 36px; color: var(--blue-primary); }
  .od-connect-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .od-connect-desc { font-size: 13px; color: var(--gray-600); line-height: 1.6; margin-bottom: 20px; }
  .btn-od-connect {
    width: 100%;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    color: white; border: none; border-radius: var(--radius-sm);
    padding: 16px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 4px 16px rgba(26,127,255,0.3);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-od-connect svg { width: 20px; height: 20px; }

  /* hidden file input for camera */
  #camera-input { display: none; }
</style>
</head>
<body>

<!-- ===== SCREEN: HOME ===== -->
<div id="screen-home" class="screen active">
  <div class="app-header">
    <div class="app-logo">
      <!-- SVGアイコン（案B） -->
      <svg width="36" height="36" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgIcon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e8f4ff"/>
            <stop offset="100%" stop-color="#c5deff"/>
          </linearGradient>
          <linearGradient id="photoIcon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a8fff"/>
            <stop offset="100%" stop-color="#1460cc"/>
          </linearGradient>
          <linearGradient id="folderIcon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a7fff"/>
            <stop offset="100%" stop-color="#005acc"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" fill="url(#bgIcon)"/>
        <circle cx="60" cy="60" r="52" fill="white" opacity="0.3"/>
        <rect x="38" y="18" width="44" height="34" rx="5" fill="url(#photoIcon)"/>
        <rect x="38" y="18" width="44" height="34" rx="5" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
        <circle cx="49" cy="28" r="4" fill="#ffe566" opacity="0.9"/>
        <polygon points="38,52 52,37 62,46 70,39 82,52" fill="#0040aa" opacity="0.5"/>
        <path d="M60 54 L60 63 L35 63 L35 72" stroke="#1a7fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 63 L85 63 L85 72" stroke="#1a7fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="31,72 35,67 39,72" fill="#1a7fff"/>
        <polygon points="81,72 85,67 89,72" fill="#1a7fff"/>
        <path d="M24 75 L24 73 Q24 72 25 72 L34 72 L36 74 L45 74 Q46 74 46 75 L46 90 Q46 91 45 91 L25 91 Q24 91 24 90 Z" fill="url(#folderIcon)"/>
        <rect x="24" y="76" width="22" height="15" rx="1" fill="white" opacity="0.15"/>
        <path d="M74 75 L74 73 Q74 72 75 72 L84 72 L86 74 L95 74 Q96 74 96 75 L96 90 Q96 91 95 91 L75 91 Q74 91 74 90 Z" fill="url(#folderIcon)"/>
        <rect x="74" y="76" width="22" height="15" rx="1" fill="white" opacity="0.15"/>
      </svg>
      <span class="app-logo-text">ShelfSnap</span>
    </div>
  </div>

  <div class="scroll-content" id="home-content">
    <!-- OneDrive未接続時 -->
    <div id="od-not-connected" style="display:none">
      <div class="od-status-banner disconnected">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        OneDriveに接続されていません
      </div>
      <div class="od-connect-card">
        <div class="od-connect-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
        </div>
        <div class="od-connect-title">OneDriveと接続</div>
        <div class="od-connect-desc">Microsoftアカウントでサインインして<br>OneDriveのフォルダと連携します</div>
        <button class="btn-od-connect" onclick="connectOneDrive()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          Microsoftアカウントでサインイン
        </button>
      </div>
    </div>

    <!-- 接続済み -->
    <div id="od-connected">

<script>
// ============================================================
// STATE
// ============================================================
const STATE = {
  folders: JSON.parse(localStorage.getItem('ss_folders') || '["A店","競合店","棚割確認"]'),
  selectedFolder: null,
  rootFolder: localStorage.getItem('ss_root') || 'ShelfSnap',
  accessToken: localStorage.getItem('ss_token') || null,
  accountName: localStorage.getItem('ss_account') || null,
  shotCount: 0,
  stream: null,
  facingMode: 'environment',
  uploadQueue: [],
};

// MSAL設定 (Azure App Registration が必要)
// GitHubにデプロイ後、以下のclientIdをAzure Portalで取得したものに差し替えてください
const MSAL_CONFIG = {
  clientId: 'YOUR_CLIENT_ID', // ← Azure Portal で取得
  redirectUri: window.location.origin + window.location.pathname,
  scopes: ['Files.ReadWrite', 'User.Read'],
};

// ============================================================
// INIT
// ============================================================
function init() {
  renderFolderGrid();
  renderFolderManageList();
  updateODStatus();
  document.getElementById('settings-root-folder').textContent = STATE.rootFolder;
}

// ============================================================
// SCREEN NAV
// ============================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  // BottomNav active state
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
}

// ============================================================
// FOLDER RENDER
// ============================================================
function renderFolderGrid() {
  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';
  STATE.folders.forEach(name => {
    const card = document.createElement('div');
    card.className = 'folder-card' + (STATE.selectedFolder === name ? ' selected' : '');
    card.innerHTML = `
      ${STATE.selectedFolder === name ? '<div class="selected-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>' : ''}
      <div class="folder-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="folder-name">${escHtml(name)}</div>
      <div class="folder-count">タップして選択</div>
    `;
    card.addEventListener('click', () => selectFolder(name));
    grid.appendChild(card);
  });
  // 追加カード
  const addCard = document.createElement('div');
  addCard.className = 'folder-card add-card';
  addCard.innerHTML = `
    <div class="folder-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div class="folder-name">フォルダを追加</div>
  `;
  addCard.addEventListener('click', openAddFolderModal);
  grid.appendChild(addCard);
}

function renderFolderManageList() {
  const list = document.getElementById('folder-manage-list');
  list.innerHTML = '';
  STATE.folders.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'folder-manage-item';
    item.innerHTML = `
      <div style="width:36px;height:36px;border-radius:10px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span class="folder-manage-name">${escHtml(name)}</span>
      <button class="btn-delete-folder" onclick="deleteFolder(${i})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    `;
    list.appendChild(item);
  });
}

function selectFolder(name) {
  STATE.selectedFolder = name;
  renderFolderGrid();
  const btn = document.getElementById('btn-open-camera');
  btn.disabled = false;
  document.getElementById('selected-folder-text').innerHTML = `保存先：<strong>${escHtml(name)}</strong>`;
}

// ============================================================
// FOLDER CRUD
// ============================================================
function openAddFolderModal() {
  document.getElementById('new-folder-input').value = '';
  document.getElementById('add-folder-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-folder-input').focus(), 300);
}
function closeAddFolderModal() {
  document.getElementById('add-folder-modal').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === e.currentTarget) {
    e.currentTarget.classList.remove('open');
  }
}
function addFolder() {
  const val = document.getElementById('new-folder-input').value.trim();
  if (!val) return;
  if (STATE.folders.includes(val)) { showToast('同じ名前のフォルダが既にあります'); return; }
  STATE.folders.push(val);
  saveFolders();
  renderFolderGrid();
  renderFolderManageList();
  closeAddFolderModal();
  showToast(`「${val}」を追加しました`);
  // OneDrive側にフォルダ作成
  if (STATE.accessToken) createOneDriveFolder(val);
}
function deleteFolder(i) {
  const name = STATE.folders[i];
  if (!confirm(`「${name}」を削除しますか？\n（OneDrive上のフォルダは削除されません）`)) return;
  STATE.folders.splice(i, 1);
  if (STATE.selectedFolder === name) {
    STATE.selectedFolder = null;
    document.getElementById('btn-open-camera').disabled = true;
    document.getElementById('selected-folder-text').innerHTML = '<span>フォルダを選択してください</span>';
  }
  saveFolders();
  renderFolderGrid();
  renderFolderManageList();
  showToast(`「${name}」を削除しました`);
}
function saveFolders() {
  localStorage.setItem('ss_folders', JSON.stringify(STATE.folders));
}

// ============================================================
// ROOT FOLDER
// ============================================================
function showRootFolderPicker() {
  document.getElementById('root-folder-input').value = STATE.rootFolder;
  document.getElementById('root-folder-modal').classList.add('open');
  setTimeout(() => document.getElementById('root-folder-input').focus(), 300);
}
function closeRootFolderModal() {
  document.getElementById('root-folder-modal').classList.remove('open');
}
function saveRootFolder() {
  const val = document.getElementById('root-folder-input').value.trim() || 'ShelfSnap';
  STATE.rootFolder = val;
  localStorage.setItem('ss_root', val);
  document.getElementById('settings-root-folder').textContent = val;
  closeRootFolderModal();
  showToast('フォルダ名を保存しました');
}

// ============================================================
// CAMERA
// ============================================================
async function openCamera() {
  if (!STATE.selectedFolder) return;
  document.getElementById('camera-folder-name').textContent = STATE.selectedFolder;
  STATE.shotCount = 0;
  updateShotCount();
  showScreen('camera');

  try {
    const constraints = {
      video: {
        facingMode: STATE.facingMode,
        width: { ideal: 3840 },
        height: { ideal: 2160 },
      }
    };
    STATE.stream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('video-preview').srcObject = STATE.stream;
  } catch (e) {
    showToast('カメラへのアクセスを許可してください');
    showScreen('home');
  }
}

function closeCamera() {
  if (STATE.stream) {
    STATE.stream.getTracks().forEach(t => t.stop());
    STATE.stream = null;
  }
  showScreen('home');
  // ナビゲーション状態リセット
  document.querySelectorAll('#screen-home .nav-item')[0].classList.add('active');
}

async function switchCamera() {
  STATE.facingMode = STATE.facingMode === 'environment' ? 'user' : 'environment';
  if (STATE.stream) {
    STATE.stream.getTracks().forEach(t => t.stop());
  }
  try {
    STATE.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: STATE.facingMode, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
    document.getElementById('video-preview').srcObject = STATE.stream;
  } catch(e) {
    showToast('カメラの切り替えに失敗しました');
  }
}

function takePhoto() {
  const video = document.getElementById('video-preview');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // フラッシュ演出
  const flash = document.getElementById('shutter-flash');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 150);

  STATE.shotCount++;
  updateShotCount();

  // ファイル名生成: フォルダ名_YYYYMMDD_HHmmss_連番.jpg
  const now = new Date();
  const fname = `${STATE.selectedFolder}_${formatDate(now)}_${String(STATE.shotCount).padStart(3,'0')}.jpg`;

  canvas.toBlob(blob => {
    if (STATE.accessToken) {
      uploadToOneDrive(blob, fname, STATE.selectedFolder);
    } else {
      // 未接続時はローカル保存
      downloadBlob(blob, fname);
      showToast(`${fname} を保存しました`);
    }
  }, 'image/jpeg', 0.92);
}

function updateShotCount() {
  document.getElementById('shot-count').textContent = `${STATE.shotCount}枚`;
}

function formatDate(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// ONEDRIVE (Microsoft Graph API)
// ============================================================
function updateODStatus() {
  const connected = !!STATE.accessToken;
  document.getElementById('od-not-connected').style.display = connected ? 'none' : 'block';
  document.getElementById('od-connected').style.display = connected ? 'block' : 'none';
  document.getElementById('od-status-connected').style.display = connected ? 'flex' : 'none';
  if (connected) {
    document.getElementById('od-account-name').textContent = STATE.accountName || '接続中';
    document.getElementById('settings-account-sub').textContent = STATE.accountName || '接続済み';
  } else {
    document.getElementById('settings-account-sub').textContent = '未接続 — タップして接続';
  }
}

// OAuth PKCE フロー
async function connectOneDrive() {
  if (MSAL_CONFIG.clientId === 'YOUR_CLIENT_ID') {
    showToast('Azure App RegistrationのクライアントIDを設定してください');
    alert('設定手順:\n1. Azure Portal (portal.azure.com) にアクセス\n2. Azure Active Directory → アプリの登録 → 新規登録\n3. リダイレクトURIに ' + window.location.href + ' を設定\n4. index.html の MSAL_CONFIG.clientId を取得したIDに変更\n5. APIのアクセス許可で Files.ReadWrite と User.Read を追加');
    return;
  }

  // PKCE code_verifier / code_challenge 生成
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);

  const params = new URLSearchParams({
    client_id: MSAL_CONFIG.clientId,
    response_type: 'code',
    redirect_uri: MSAL_CONFIG.redirectUri,
    scope: MSAL_CONFIG.scopes.join(' '),
    code_challenge: challenge,
    code_challenge_method: 'S256',
    response_mode: 'query',
  });
  window.location.href = `https://login.microsoftonline.com/common/oauth2/v2.0/authorize?${params}`;
}

async function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return;

  // URLをクリーンアップ
  window.history.replaceState({}, '', window.location.pathname);

  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) return;

  try {
    const res = await fetch('https://login.microsoftonline.com/common/oauth2/v2.0/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: MSAL_CONFIG.clientId,
        grant_type: 'authorization_code',
        code,
        redirect_uri: MSAL_CONFIG.redirectUri,
        code_verifier: verifier,
        scope: MSAL_CONFIG.scopes.join(' '),
      })
    });
    const data = await res.json();
    if (data.access_token) {
      STATE.accessToken = data.access_token;
      localStorage.setItem('ss_token', data.access_token);

      // ユーザー情報取得
      const me = await fetch('https://graph.microsoft.com/v1.0/me', {
        headers: { Authorization: `Bearer ${data.access_token}` }
      }).then(r => r.json());
      STATE.accountName = me.displayName || me.userPrincipalName || '接続済み';
      localStorage.setItem('ss_account', STATE.accountName);

      // ルートフォルダ作成
      await ensureRootFolder();
      updateODStatus();
      showToast(`${STATE.accountName} で接続しました`);
    }
  } catch(e) {
    showToast('接続に失敗しました。再度お試しください。');
  }
}

async function ensureRootFolder() {
  await createOneDriveFolderPath(STATE.rootFolder);
}

async function createOneDriveFolder(folderName) {
  if (!STATE.accessToken) return;
  const path = `${STATE.rootFolder}/${folderName}`;
  await createOneDriveFolderPath(path);
}

async function createOneDriveFolderPath(path) {
  const parts = path.split('/');
  let currentPath = '/drive/root';
  for (const part of parts) {
    try {
      await fetch(`https://graph.microsoft.com/v1.0/me${currentPath}/children`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${STATE.accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          name: part,
          folder: {},
          '@microsoft.graph.conflictBehavior': 'ignore',
        })
      });
      currentPath += `/children/${encodeURIComponent(part)}:`;
    } catch(e) {}
  }
}

async function uploadToOneDrive(blob, filename, folderName) {
  if (!STATE.accessToken) return;

  // キューに追加
  const queueItem = { name: filename, status: 'uploading' };
  STATE.uploadQueue.unshift(queueItem);
  renderUploadQueue();

  const uploadPath = `${STATE.rootFolder}/${folderName}/${filename}`;
  const url = `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURIComponent(uploadPath)}:/content`;

  try {
    // フォルダが存在しない場合は作成
    await createOneDriveFolder(folderName);

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${STATE.accessToken}`,
        'Content-Type': 'image/jpeg',
      },
      body: blob,
    });

    if (res.ok) {
      queueItem.status = 'done';
      showToast(`${filename} を保存しました`);
    } else {
      throw new Error('Upload failed');
    }
  } catch(e) {
    queueItem.status = 'error';
    showToast('アップロードに失敗しました');
    // フォールバック：ローカル保存
    downloadBlob(blob, filename);
  }
  renderUploadQueue();
}

function renderUploadQueue() {
  const section = document.getElementById('upload-queue-section');
  const list = document.getElementById('upload-list');
  const recent = STATE.uploadQueue.slice(0, 5);
  if (recent.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = recent.map(item => `
    <div class="upload-item">
      <div class="upload-status ${item.status}"></div>
      <span style="flex:1">${escHtml(item.name)}</span>
      <span style="font-size:10px;color:var(--gray-400)">${item.status === 'done' ? '完了' : item.status === 'uploading' ? '送信中…' : 'エラー'}</span>
    </div>
  `).join('');
}

function signOut() {
  if (!confirm('サインアウトしますか？')) return;
  STATE.accessToken = null;
  STATE.accountName = null;
  localStorage.removeItem('ss_token');
  localStorage.removeItem('ss_account');
  updateODStatus();
  showToast('サインアウトしました');
}

// ============================================================
// PKCE helpers
// ============================================================
function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}
async function generateCodeChallenge(verifier) {
  const encoder = new TextEncoder();
  const data = encoder.encode(verifier);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

// ============================================================
// UTILS
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// BOOT
// ============================================================
init();
handleOAuthCallback();
</script>
